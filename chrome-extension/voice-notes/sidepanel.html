<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Voice Notes</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      background: #121212;
      color: #f2f2f2;
      margin: 0;
      padding: 18px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: #999; font-size: 13px; margin-bottom: 20px; }

    .control-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 18px;
    }
    #micBtn {
      width: 72px;
      height: 72px;
      flex-shrink: 0;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      cursor: pointer;
      background: #0a84ff;
      color: white;
      transition: 0.2s;
      margin-bottom: 10px;
    }
    #micBtn.listening {
      background: #ff453a;
      animation: pulse 1.2s infinite;
    }
    #micBtn:disabled { cursor: not-allowed; opacity: 0.5; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,69,58,0.5); }
      70% { box-shadow: 0 0 0 16px rgba(255,69,58,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,69,58,0); }
    }
    #status { font-size: 14px; color: #bbb; margin-bottom: 2px; }
    #timer {
      font-size: 12px;
      color: #555;
      font-variant-numeric: tabular-nums;
      min-height: 16px;
    }
    #timer.is-active { color: #ff8a80; }

    #interim {
      min-height: 20px;
      color: #888;
      font-style: italic;
      margin-bottom: 16px;
      font-size: 13px;
      text-align: center;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .toolbar button {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #f2f2f2;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .toolbar button:hover { background: #2a2a2a; }

    #notesList {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
    }
    .note {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px 14px;
      position: relative;
    }
    .note.is-active {
      border-color: #0a84ff;
      border-left-width: 3px;
    }
    .note .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .note .time { font-size: 11px; color: #777; }
    .note .badge {
      font-size: 10px;
      color: #0a84ff;
      background: rgba(10, 132, 255, 0.12);
      padding: 1px 6px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .note .text {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .note .delete {
      position: absolute;
      top: 8px;
      right: 10px;
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 13px;
    }
    .note .delete:hover { color: #ff453a; }
    #empty { color: #666; font-size: 13px; text-align: center; margin-top: 40px; }

    .footer {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #242424;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .footer-note { font-size: 11px; color: #555; }
    #langSelect {
      background: #1e1e1e;
      color: #ccc;
      border: 1px solid #333;
      border-radius: 6px;
      font-size: 12px;
      padding: 4px 6px;
    }
  </style>
</head>
<body>
  <h1>🎙️ Voice Notes</h1>
  <div class="sub">Speak — the whole session gets noted down as one continuous note.</div>

  <div class="control-card">
    <button id="micBtn">🎙️</button>
    <div id="status">Click the mic to start</div>
    <div id="timer"></div>
  </div>

  <div id="interim"></div>

  <div class="toolbar">
    <button id="copyBtn">Copy</button>
    <button id="exportBtn">Export .txt</button>
    <button id="clearBtn">Clear all</button>
  </div>

  <div id="notesList"></div>
  <div id="empty">No notes yet — click the mic and start talking.</div>

  <div class="footer">
    <span class="footer-note">Language</span>
    <select id="langSelect">
      <option value="en-US">English (US)</option>
      <option value="hi-IN">Hindi (India)</option>
    </select>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
